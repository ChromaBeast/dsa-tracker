name: sync-leetcode

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun scripts/sync.ts
        env:
          LC_USER: ${{ vars.LEETCODE_USERNAME || secrets.LEETCODE_USERNAME || vars.LC_USER || secrets.LC_USER || 'ChromaBeast' }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD || '1234' }}
          OLD_TRACKER_PASSWORD: ${{ secrets.OLD_TRACKER_PASSWORD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || vars.UPSTASH_REDIS_REST_TOKEN }}

      - name: Commit progress
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || (git commit -m "Update progress" && git push)
